<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LangApp</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5f4;--card:#fff;--ink:#14212b;--mute:#5d6b76;--line:#d9e1e0;--blue:#1d4e89;--teal:#13917f;--onblue:#fff}
:root[data-theme=dark]{--bg:#0e1a22;--card:#16252f;--ink:#e8eff2;--mute:#92a3ad;--line:#26394a;--blue:#6fb0f0;--teal:#3cc7b3;--onblue:#0e1a22}
*{box-sizing:border-box;margin:0}
body{font:16px/1.5 'Atkinson Hyperlegible',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
h1,.word,h2{font-family:'Bricolage Grotesque',sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:820px;margin:auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:24px;font-weight:800;color:var(--blue);margin-right:auto}
.tabs{display:flex;gap:4px}
button{font:inherit;color:inherit;cursor:pointer}
.tab{padding:8px 14px;border:0;border-radius:8px;background:none;font-weight:700;color:var(--mute)}
.tab.on{background:var(--blue);color:var(--onblue)}
.icon{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 10px}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
main{max-width:820px;margin:auto;padding:20px 16px 60px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input[type=search]{flex:1;min-width:180px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{padding:5px 12px;border:1px solid var(--line);border-radius:99px;background:none;font-size:14px}
.chip.on{background:var(--teal);border-color:var(--teal);color:var(--onblue);font-weight:700}
.count{color:var(--mute);font-size:14px;margin-bottom:10px}
.list{display:grid;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;text-align:left;width:100%}
.row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.word{font-size:20px;font-weight:800}
.tag{font-size:12px;font-weight:700;color:var(--teal);border:1px solid var(--teal);border-radius:5px;padding:1px 7px}
.mean{color:var(--mute);margin-top:2px}
.ex{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-style:italic}
.card.open .ex{display:block}
.fav{border:0;background:none;font-size:20px;padding:0 4px;color:var(--mute)}
.fav.on{color:#e0a100}
.more{display:block;margin:18px auto 0;padding:10px 24px;border:1px solid var(--blue);border-radius:8px;background:none;color:var(--blue);font-weight:700}
.empty{padding:36px 18px;border:2px dashed var(--line);border-radius:12px;text-align:center;color:var(--mute)}
.empty b{color:var(--ink)}
code{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:14px}
.res a.t{font-weight:700;color:var(--blue);text-decoration:none;font-size:18px}
.res a.t:hover{text-decoration:underline}
.res iframe,.res video{width:100%;aspect-ratio:16/9;border:0;border-radius:8px;margin-top:10px;background:#000}
.play{margin-top:10px;border:0;padding:0;background:none;width:100%}
.play img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;display:block}
.hide{display:none}
</style>
</head>
<body>
<header><div class="bar">
  <h1>LangApp</h1>
  <nav class="tabs" aria-label="Bölümler">
    <button class="tab on" data-tab="words">Kelimeler</button>
    <button class="tab" data-tab="res">Kaynaklar</button>
  </nav>
  <button class="icon" id="theme" aria-label="Tema değiştir">🌓</button>
</div></header>

<main>
  <section id="words">
    <div class="tools"><input type="search" id="q" placeholder="Kelime ara"><button class="chip" id="favOnly">☆ Favoriler</button></div>
    <div class="chips" id="levels"></div>
    <div class="count" id="wcount"></div>
    <div class="list" id="wlist"></div>
    <button class="more hide" id="wmore">Daha fazla göster</button>
  </section>

  <section id="res" class="hide">
    <div class="tools"><input type="search" id="rq" placeholder="Kaynak ara"></div>
    <div class="chips" id="types"></div>
    <div class="list res" id="rlist"></div>
  </section>
</main>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};

/* tema */
const root=document.documentElement;
root.dataset.theme=store.get('theme',matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
$('#theme').onclick=()=>{root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';store.set('theme',root.dataset.theme)};

/* sekmeler */
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));
  $('#words').classList.toggle('hide',b.dataset.tab!=='words');
  $('#res').classList.toggle('hide',b.dataset.tab!=='res');
  if(b.dataset.tab==='res'&&!resLoaded)loadRes();
});

/* ---------- KELİMELER ---------- */
const LEVELS=['A1','A2','B1','B2','C1','C2','IELTS','TOEFL'];
const normLevel=l=>String(l||'').toUpperCase().replace(/^WORDS_/,'');
let words=[],page=0,done=false,level='all',shown=50,favOnly=false;
let favs=new Set(store.get('favs',[]));

$('#levels').innerHTML=['all',...LEVELS].map(l=>`<button class="chip${l==='all'?' on':''}" data-l="${l}">${l==='all'?'Tümü':l}</button>`).join('');
$('#levels').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;level=b.dataset.l;shown=50;
  document.querySelectorAll('#levels .chip').forEach(x=>x.classList.toggle('on',x===b));renderWords()};
$('#q').oninput=()=>{shown=50;renderWords()};
$('#favOnly').onclick=e=>{favOnly=!favOnly;e.target.classList.toggle('on',favOnly);shown=50;renderWords()};
$('#wmore').onclick=()=>{shown+=50;renderWords()};

async function loadAllWords(){
  while(!done){
    try{
      const r=await fetch(`data/words/page${page}.json`);
      if(!r.ok)throw 0;
      const d=await r.json();
      words.push(...d.map(w=>({...w,level:normLevel(w.level)})));
      page++;
    }catch{done=true}
  }
  renderWords();
}

function renderWords(){
  const q=$('#q').value.trim().toLowerCase();
  const list=words.filter(w=>(level==='all'||w.level===level)&&(!favOnly||favs.has(w.word))&&(!q||(w.word+' '+w.meaning).toLowerCase().includes(q)));
  const box=$('#wlist');
  if(!words.length){
    box.innerHTML=`<div class="empty"><b>Henüz kelime yok.</b><br>Kelimeleri <code>data/words/page0.json</code>, <code>page1.json</code>… olarak ekle.</div>`;
    $('#wcount').textContent='';$('#wmore').classList.add('hide');return;
  }
  $('#wcount').textContent=`${list.length} kelime`;
  box.innerHTML=list.slice(0,shown).map((w,i)=>`
    <div class="card" data-w="${esc(w.word)}" tabindex="0" role="button">
      <div class="row"><span class="word">${esc(w.word)}</span>
        <span>${w.level?`<span class="tag">${esc(w.level)}</span>`:''}
        <button class="fav${favs.has(w.word)?' on':''}" aria-label="Favori">${favs.has(w.word)?'★':'☆'}</button></span></div>
      <div class="mean">${esc(w.meaning)}</div>
      ${w.example?`<div class="ex">${esc(w.example)}</div>`:''}
    </div>`).join('')||`<div class="empty">Sonuç bulunamadı.</div>`;
  $('#wmore').classList.toggle('hide',list.length<=shown);
}
$('#wlist').onclick=e=>{
  const c=e.target.closest('.card');if(!c)return;
  if(e.target.closest('.fav')){
    const w=c.dataset.w;favs.has(w)?favs.delete(w):favs.add(w);store.set('favs',[...favs]);renderWords();return;
  }
  c.classList.toggle('open');
};
$('#wlist').onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('card')){e.preventDefault();e.target.classList.toggle('open')}};

/* ---------- KAYNAKLAR ---------- */
const TYPES={link:'Site',video:'Video',pdf:'PDF',slides:'Slayt'};
let res=[],resLoaded=false,rtype='all';

async function loadRes(){
  resLoaded=true;
  try{const r=await fetch('data/resources.json');res=r.ok?await r.json():[]}catch{res=[]}
  $('#types').innerHTML=['all',...Object.keys(TYPES)].map(t=>`<button class="chip${t==='all'?' on':''}" data-t="${t}">${t==='all'?'Tümü':TYPES[t]}</button>`).join('');
  renderRes();
}
$('#types').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;rtype=b.dataset.t;
  document.querySelectorAll('#types .chip').forEach(x=>x.classList.toggle('on',x===b));renderRes()};
$('#rq').oninput=()=>renderRes();

const ytId=u=>{const m=String(u).match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);return m&&m[1]};
const safeUrl=u=>/^(https?:\/\/|files\/|\.\/files\/)/.test(u)?u:'#';

function renderRes(){
  const q=$('#rq').value.trim().toLowerCase();
  const list=res.filter(r=>(rtype==='all'||r.type===rtype)&&(!q||(r.title+' '+(r.note||'')).toLowerCase().includes(q)));
  const box=$('#rlist');
  if(!res.length){
    box.innerHTML=`<div class="empty"><b>Henüz kaynak yok.</b><br><code>data/resources.json</code> dosyasına ekle. Dosyalar için <code>files/</code> klasörünü kullan.</div>`;return;
  }
  box.innerHTML=list.map((r,i)=>{
    const url=safeUrl(r.url),yt=r.type==='video'&&ytId(r.url);
    let media='';
    if(yt)media=`<button class="play" data-yt="${yt}" aria-label="Videoyu oynat"><img loading="lazy" src="https://img.youtube.com/vi/${yt}/hqdefault.jpg" alt=""></button>`;
    else if(r.type==='video'&&/\.mp4$/i.test(url))media=`<video controls preload="metadata" src="${esc(url)}"></video>`;
    return `<div class="card"><div class="row"><a class="t" href="${esc(url)}" target="_blank" rel="noopener">${esc(r.title)}</a><span class="tag">${esc(TYPES[r.type]||r.type)}</span></div>
      ${r.note?`<div class="mean">${esc(r.note)}</div>`:''}${media}</div>`;
  }).join('')||`<div class="empty">Sonuç bulunamadı.</div>`;
}
$('#rlist').onclick=e=>{
  const p=e.target.closest('.play');if(!p)return;
  p.outerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${p.dataset.yt}?autoplay=1" allow="autoplay;encrypted-media;fullscreen" allowfullscreen></iframe>`;
};

loadAllWords();
</script>
</body>
</html>
